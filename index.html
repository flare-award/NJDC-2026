 там можно посмотреть статистику и скачать демо-запись после завершения игры.",sort_order:6},{id:"f7",question:"Где посмотреть правила турнира?",answer:"Полный регламент турнира доступен в PDF-файле внизу страницы, в разделе «Регламент».",sort_order:7}],jx={hero_title:"NJDC 2026",hero_subtitle:"Nodben Joski Duo Cup — турнир 2×2 по Counter-Strike 2",announcement:"Регистрация завершена. Жеребьёвка Этапа 1 проведена — впереди 5 этапов борьбы!",prize_text:"Lite подписка CYBERSHOKE для двух игроков команды-чемпиона + официальный диплом победителя турнира.",regulations_url:"/NJDC 2026 regulations.pdf",server_name:"Нодбин Жоски"},Sx="njdc_store_v1";function ag(){try{const a=localStorage.getItem(Sx);if(a)return JSON.parse(a)}catch{}return{teams:Gj,players:Vj,matches:Kj,faq:Ij,settings:jx,votes:[]}}function Yj(a){localStorage.setItem(Sx,JSON.stringify(a))}function Jj(){return crypto.randomUUID()}const Nx=j.createContext(null);function Xj({children:a}){const[n,r]=j.useState(!0),[i,c]=j.useState([]),[u,h]=j.useState([]),[m,p]=j.useState([]),[g,y]=j.useState([]),[b,_]=j.useState(jx),[w,S]=j.useState([]),N=j.useCallback(async()=>{if(!se)return;const[Z,J,U,G,te,_e]=await Promise.all([se.from("teams").select("*").order("sort_order",{ascending:!0}),se.from("players").select("*"),se.from("matches").select("*").order("stage",{ascending:!0}).order("match_number",{ascending:!0}),se.from("faq").select("*").order("sort_order",{ascending:!0}),se.from("settings").select("*").eq("id","main").maybeSingle(),se.from("votes").select("*")]);Z.data&&c(Z.data),J.data&&h(J.data),U.data&&p(U.data),G.data&&y(G.data),te.data&&_(te.data),_e.data&&S(_e.data)},[]),E=j.useCallback(async()=>{if(r(!0),ze&&se)try{await N()}catch(Z){console.error("Supabase load failed, falling back to local store",Z);const J=ag();c(J.teams),h(J.players),p(J.matches),y(J.faq),_(J.settings),S(J.votes)}else{const Z=ag();c(Z.teams),h(Z.players),p(Z.matches),y(Z.faq),_(Z.settings),S(Z.votes)}r(!1)},[N]);j.useEffect(()=>{E()},[E]),   <body>
    <div id="root"></div>
    <script>
      // Инлайн-скрипт: перехватывает ссылки из писем Supabase (recovery, signup,
      // magic_link), сохраняет токены в sessionStorage и перенаправляет на
      // /reset-password, где React-страница обработает их.
      // Это нужно, потому что HashRouter «съедает» хеш с токенами.
      (function () {
        var hash = window.location.hash || "";
        if (
          hash.indexOf("type=recovery") !== -1 ||
          hash.indexOf("type=signup") !== -1 ||
          hash.indexOf("type=magic_link") !== -1 ||
          (hash.indexOf("access_token=") !== -1 && hash.indexOf("type=") !== -1)
        ) {
          sessionStorage.setItem("njdc_supabase_auth_hash", hash);
          window.location.hash = "/reset-password";
        }
      })();
    </script>
  </body>
