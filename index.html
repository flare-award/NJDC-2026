 там можно посмотреть статистику и скачать демо-запись после завершения игры.",sort_order:6},{id:"f7",question:"Где посмотреть правила турнира?",answer:"Полный регламент турнира доступен в PDF-файле внизу страницы, в разделе «Регламент».",sort_order:7}],sx={hero_title:"NJDC 2026",hero_subtitle:"Nodben Joski Duo Cup — турнир 2×2 по Counter-Strike 2",announcement:"Регистрация завершена. Жеребьёвка Этапа 1 проведена — впереди 5 этапов борьбы!",prize_text:"Lite подписка CYBERSHOKE для двух игроков команды-чемпиона + официальный диплом победителя турнира.",regulations_url:"/NJDC 2026 regulations.pdf",server_name:"Нодбин Жоски"},rx="njdc_store_v1";function G0(){try{const a=localStorage.getItem(rx);if(a)return JSON.parse(a)}catch{}return{teams:Cj,players:Rj,matches:Oj,faq:zj,settings:sx,votes:[]}}function Dj(a){localStorage.setItem(rx,JSON.stringify(a))}function Uj(){return crypto.randomUUID()}const ix=j.createContext(null);function Mj({children:a}){const[n,r]=j.useState(!0),[i,c]=j.useState([]),[u,h]=j.useState([]),[m,p]=j.useState([]),[g,y]=j.useState([]),[b,_]=j.useState(sx),[w,S]=j.useState([]),E=j.useCallback(async()=>{if(!se)return;const[W,z,T,H,P,ae]=await Promise.all([se.from("teams").select("*").order("sort_order",{ascending:!0}),se.from("players").select("*"),se.from("matches").select("*").order("stage",{ascending:!0}).order("match_number",{ascending:!0}),se.from("faq").select("*").order("sort_order",{ascending:!0}),se.from("settings").select("*").eq("id","main").maybeSingle(),se.from("votes").select("*")]);W.data&&c(W.data),z.data&&h(z.data),T.data&&p(T.data),H.data&&y(H.data),P.data&&_(P.data),ae.data&&S(ae.data)},[]),A=j.useCallback(async()=>{if(r(!0),Ue&&se)try{await E()}catch(W){console.error("Supabase load failed, falling back to local store",W);const z=G0();c(z.teams),h(z.players),p(z.matches),y(z.faq),_(z.settings),S(z.votes)}else{const W=G0();c(W.teams),h(W.players),p(W.matches),y(W.faq),_(W.settings),S(W.votes)}r(!1)},[E]);j.useEffect(()=>{A()},[A]),j.u
