 посмотреть правила турнира?",answer:"Полный регламент турнира доступен в PDF-файле внизу страницы, в разделе «Регламент».",sort_order:7}],u0={hero_title:"NJDC 2026",hero_subtitle:"Nodben Joski Duo Cup — турнир 2×2 по Counter-Strike 2",announcement:"Регистрация завершена. Жеребьёвка Этапа 1 проведена — впереди 5 этапов борьбы!",prize_text:"Lite подписка CYBERSHOKE для двух игроков команды-чемпиона + официальный диплом победителя турнира.",regulations_url:"/NJDC 2026 regulations.pdf",server_name:"Нодбин Жоски"},c0="njdc_store_v1";function ug(){try{const s=localStorage.getItem(c0);if(s)return JSON.parse(s)}catch{}return{teams:U1,players:M1,matches:L1,faq:B1,settings:u0,votes:[]}}function H1(s){localStorage.setItem(c0,JSON.stringify(s))}function q1(){return crypto.randomUUID()}const h0=T.createContext(null);function $1({children:s}){const[n,i]=T.useState(!0),[l,o]=T.useState([]),[u,d]=T.useState([]),[p,m]=T.useState([]),[g,v]=T.useState([]),[b,_]=T.useState(u0),[w,j]=T.useState([]),E=T.useCallback(async()=>{if(!re)return;const[P,K,D,V,X,ye]=await Promise.all([re.from("teams").select("*").order("sort_order",{ascending:!0}),re.from("players").select("*"),re.from("matches").select("*").order("stage",{ascending:!0}).order("match_number",{ascending:!0}),re.from("faq").select("*").order("sort_order",{ascending:!0}),re.from("settings").select("*").eq("id","main").maybeSingle(),re.from("votes").select("*")]);P.data&&o(P.data),K.data&&d(K.data),D.data&&m(D.data),V.data&&v(V.data),X.data&&_(X.data),ye.data&&j(ye.data)},[]),R=T.useCallback(async()=>{if(i(!0),Be&&re)try{await E()}catch(P){console.error("Supabase load failed, falling back to local store",P);const K=ug();o(K.teams),d(K.players),m(K.matches),v(K.faq),_(K.settings),j(K.votes)}else{const P=ug();o(P.teams),d(P.players),m(P.matches),v(P.faq),_(P.settings),j(P.votes)}i(!1)},[E]);T.useEffect(()=>{R()},[R]),T.useEffect(()=>{if(!Be||!re)return;const P=re,K=P.channel("njdc-realtime").on("postgres_changes",{event:"*",schema:"p
