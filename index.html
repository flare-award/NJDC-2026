 там можно посмотреть статистику и скачать демо-запись после завершения игры.",sort_order:6},{id:"f7",question:"Где посмотреть правила турнира?",answer:"Полный регламент турнира доступен в PDF-файле внизу страницы, в разделе «Регламент».",sort_order:7}],xx={hero_title:"NJDC 2026",hero_subtitle:"Nodben Joski Duo Cup — турнир 2×2 по Counter-Strike 2",announcement:"Регистрация завершена. Жеребьёвка Этапа 1 проведена — впереди 5 этапов борьбы!",prize_text:"Lite подписка CYBERSHOKE для двух игроков команды-чемпиона + официальный диплом победителя турнира.",regulations_url:"/NJDC 2026 regulations.pdf",server_name:"Нодбин Жоски"},bx="njdc_store_v1";function eg(){try{const a=localStorage.getItem(bx);if(a)return JSON.parse(a)}catch{}return{teams:Mj,players:Bj,matches:Lj,faq:$j,settings:xx,votes:[]}}function Hj(a){localStorage.setItem(bx,JSON.stringify(a))}function qj(){return crypto.randomUUID()}const yx=j.createContext(null);function Pj({children:a}){const[n,r]=j.useState(!0),[i,c]=j.useState([]),[u,f]=j.useState([]),[m,p]=j.useState([]),[g,y]=j.useState([]),[b,_]=j.useState(xx),[w,S]=j.useState([]),k=j.useCallback(async()=>{if(!ae)return;const[Z,Y,M,I,B,W]=await Promise.all([ae.from("teams").select("*").order("sort_order",{ascending:!0}),ae.from("players").select("*"),ae.from("matches").select("*").order("stage",{ascending:!0}).order("match_number",{ascending:!0}),ae.from("faq").select("*").order("sort_order",{ascending:!0}),ae.from("settings").select("*").eq("id","main").maybeSingle(),ae.from("votes").select("*")]);Z.data&&c(Z.data),Y.data&&f(Y.data),M.data&&p(M.data),I.data&&y(I.data),B.data&&_(B.data),W.data&&S(W.data)},[]),E=j.useCallback(async()=>{if(r(!0),ze&&ae)try{await k()}catch(Z){console.error("Supabase load failed, falling back to local store",Z);const Y=eg();c(Y.teams),f(Y.players),p(Y.matches),y(Y.faq),_(Y.settings),S(Y.votes)}else{const Z=eg();c(Z.teams),f(Z.players),p(Z.matches),y(Z.faq),_(Z.settings),S(Z.votes)}r(!1)},[k]);j.useEffect(()=>{E()},[E]),j.useE   <body>
    <div id="root"></div>
    <script>
      // Инлайн-скрипт: перехватывает ссылки из писем Supabase (recovery, signup,
      // magic_link), сохраняет токены в sessionStorage и перенаправляет на
      // /reset-password, где React-страница обработает их.
      // Это нужно, потому что HashRouter «съедает» хеш с токенами.
      (function () {
        var hash = window.location.hash || "";
        if (
          hash.indexOf("type=recovery") !== -1 ||
          hash.indexOf("type=signup") !== -1 ||
          hash.indexOf("type=magic_link") !== -1 ||
          (hash.indexOf("access_token=") !== -1 && hash.indexOf("type=") !== -1)
        ) {
          sessionStorage.setItem("njdc_supabase_auth_hash", hash);
          window.location.hash = "/reset-password";
        }
      })();
    </script>
  </body>
