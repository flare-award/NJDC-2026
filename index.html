 там можно посмотреть статистику и скачать демо-запись после завершения игры.",sort_order:6},{id:"f7",question:"Где посмотреть правила турнира?",answer:"Полный регламент турнира доступен в PDF-файле внизу страницы, в разделе «Регламент».",sort_order:7}],Nx={hero_title:"NJDC 2026",hero_subtitle:"Nodben Joski Duo Cup — турнир 2×2 по Counter-Strike 2",announcement:"Регистрация завершена. Жеребьёвка Этапа 1 проведена — впереди 5 этапов борьбы!",prize_text:"Lite подписка CYBERSHOKE для двух игроков команды-чемпиона + официальный диплом победителя турнира.",regulations_url:"/NJDC 2026 regulations.pdf",server_name:"Нодбин Жоски"},Ex="njdc_store_v1";function rg(){try{const a=localStorage.getItem(Ex);if(a)return JSON.parse(a)}catch{}return{teams:Gj,players:Vj,matches:Kj,faq:Ij,settings:Nx,votes:[]}}function Yj(a){localStorage.setItem(Ex,JSON.stringify(a))}function Jj(){return crypto.randomUUID()}const kx=j.createContext(null);function Xj({children:a}){const[n,r]=j.useState(!0),[i,c]=j.useState([]),[u,h]=j.useState([]),[m,p]=j.useState([]),[g,y]=j.useState([]),[b,_]=j.useState(Nx),[w,S]=j.useState([]),N=j.useCallback(async()=>{if(!ae)return;const[X,Y,D,K,te,Te]=await Promise.all([ae.from("teams").select("*").order("sort_order",{ascending:!0}),ae.from("players").select("*"),ae.from("matches").select("*").order("stage",{ascending:!0}).order("match_number",{ascending:!0}),ae.from("faq").select("*").order("sort_order",{ascending:!0}),ae.from("settings").select("*").eq("id","main").maybeSingle(),ae.from("votes").select("*")]);X.data&&c(X.data),Y.data&&h(Y.data),D.data&&p(D.data),K.data&&y(K.data),te.data&&_(te.data),Te.data&&S(Te.data)},[]),k=j.useCallback(async()=>{if(r(!0),Be&&ae)try{await N()}catch(X){console.error("Supabase load failed, falling back to local store",X);const Y=rg();c(Y.teams),h(Y.players),p(Y.matches),y(Y.faq),_(Y.settings),S(Y.votes)}else{const X=rg();c(X.teams),h(X.players),p(X.matches),y(X.faq),_(X.settings),S(X.votes)}r(!1)},[N]);j.useEffect(()=>{k()},[k]),   <body>
    <div id="root"></div>
    <script>
      // Инлайн-скрипт: перехватывает ссылки из писем Supabase (recovery, signup,
      // magic_link), сохраняет токены в sessionStorage и перенаправляет на
      // /reset-password, где React-страница обработает их.
      // Это нужно, потому что HashRouter «съедает» хеш с токенами.
      (function () {
        var hash = window.location.hash || "";
        if (
          hash.indexOf("type=recovery") !== -1 ||
          hash.indexOf("type=signup") !== -1 ||
          hash.indexOf("type=magic_link") !== -1 ||
          (hash.indexOf("access_token=") !== -1 && hash.indexOf("type=") !== -1)
        ) {
          sessionStorage.setItem("njdc_supabase_auth_hash", hash);
          window.location.hash = "/reset-password";
        }
      })();
    </script>
  </body>
