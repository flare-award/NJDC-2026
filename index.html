 — там можно посмотреть статистику и скачать демо-запись после завершения игры.",sort_order:6},{id:"f7",question:"Где посмотреть правила турнира?",answer:"Полный регламент турнира доступен в PDF-файле внизу страницы, в разделе «Регламент».",sort_order:7}],Db={hero_title:"NJDC 2026",hero_subtitle:"Nodben Joski Duo Cup — турнир 2×2 по Counter-Strike 2",announcement:"Регистрация завершена. Жеребьёвка Этапа 1 проведена — впереди 5 этапов борьбы!",prize_text:"Lite подписка CYBERSHOKE для двух игроков команды-чемпиона + официальный диплом победителя турнира.",regulations_url:"/NJDC 2026 regulations.pdf",server_name:"Нодбин Жоски"},Mb="njdc_store_v1";function bx(){try{const s=localStorage.getItem(Mb);if(s)return JSON.parse(s)}catch{}return{teams:Fj,players:Wj,matches:eN,faq:tN,settings:Db,votes:[]}}function nN(s){localStorage.setItem(Mb,JSON.stringify(s))}function sN(){return crypto.randomUUID()}const Ub=v.createContext(null);function aN({children:s}){const[n,r]=v.useState(!0),[l,c]=v.useState([]),[u,h]=v.useState([]),[m,p]=v.useState([]),[x,y]=v.useState([]),[g,j]=v.useState(Db),[w,S]=v.useState([]),N=v.useCallback(async()=>{if(!P)return;const[te,F,B,Z,ce,je]=await Promise.all([P.from("teams").select("*").order("sort_order",{ascending:!0}),P.from("players").select("*"),P.from("matches").select("*").order("stage",{ascending:!0}).order("match_number",{ascending:!0}),P.from("faq").select("*").order("sort_order",{ascending:!0}),P.from("settings").select("*").eq("id","main").maybeSingle(),P.from("votes").select("*")]);te.data&&c(te.data),F.data&&h(F.data),B.data&&p(B.data),Z.data&&y(Z.data),ce.data&&j(ce.data),je.data&&S(je.data)},[]),k=v.useCallback(async()=>{if(r(!0),fe&&P)try{await N()}catch(te){console.error("Supabase load failed, falling back to local store",te);const F=bx();c(F.teams),h(F.players),p(F.matches),y(F.faq),j(F.settings),S(F.votes)}else{const te=bx();c(te.teams),h(te.players),p(te.matches),y(te.faq),j(te.settings),S(te.votes)}r(!1)},[N]);v.useEffect(()=>{k()}   <body>
    <div id="root"></div>
    <script>
      // Инлайн-скрипт: перехватывает ссылки из писем Supabase (recovery, signup,
      // magic_link), сохраняет токены в sessionStorage и перенаправляет на
      // /reset-password, где React-страница обработает их.
      // Это нужно, потому что HashRouter «съедает» хеш с токенами.
      (function () {
        var hash = window.location.hash || "";
        if (
          hash.indexOf("type=recovery") !== -1 ||
          hash.indexOf("type=signup") !== -1 ||
          hash.indexOf("type=magic_link") !== -1 ||
          (hash.indexOf("access_token=") !== -1 && hash.indexOf("type=") !== -1)
        ) {
          sessionStorage.setItem("njdc_supabase_auth_hash", hash);
          window.location.hash = "/reset-password";
        }
      })();
    </script>
